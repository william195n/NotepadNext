name: Build Notepad Next

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:

env:
  QT_RELEASE_VER: 6.8
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ─── Windows (x64) ──────────────────────────────────────────
          - os: windows-latest
            platform: windows
            qt_version: "6.8"
          - os: windows-latest
            platform: windows
            qt_version: "6.10"

          # ─── Linux (x64) ────────────────────────────────────────────
          - os: ubuntu-24.04
            platform: linux
            qt_version: "6.8"
          - os: ubuntu-24.04
            platform: linux
            qt_version: "6.10"


          # ─── macOS Apple Silicon (arm64) ────────────────────────────
          - os: macos-14
            platform: mac
            arch: arm64
            cmake_arch: arm64
            qt_arch: clang_64
            qt_version: "6.8"
            deployment_target: "13.0"
          - os: macos-14
            platform: mac
            arch: arm64
            cmake_arch: arm64
            qt_arch: clang_64
            qt_version: "6.10"
            deployment_target: "14.0"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ─── Install Qt (Windows / Linux via jurplel) ──────────────
      - name: Install Qt (Windows / Linux)
        if: matrix.platform != 'mac'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          modules: 'qt5compat'
          cache: true

      # ─── Install Qt (macOS via jdpurcell for arch support) ─────
      - name: Install Qt (macOS)
        if: matrix.platform == 'mac'
        uses: jdpurcell/install-qt-action@v5
        with:
          version: ${{ matrix.qt_version }}
          host: mac
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qt5compat
          cache: true

      - name: Setup Visual Studio Tools
        if: matrix.platform == 'windows'
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Install NSIS
        if: matrix.platform == 'windows'
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Setup Linux
        if: matrix.platform == 'linux'
        run: |
          echo "DISTRIBUTION=AppImage" >> "$GITHUB_ENV"
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 fuse libxcb-cursor-dev libcups2-dev

      - name: Set Distribution (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        run: echo "DISTRIBUTION=dmg" >> "$GITHUB_ENV"

      - name: Configure
        shell: bash
        run: |
          CMAKE_OPTS=(-S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAPP_DISTRIBUTION="${DISTRIBUTION}")
          if [ "${{ matrix.platform }}" = "mac" ]; then
            CMAKE_OPTS+=(-DCMAKE_OSX_ARCHITECTURES="${{ matrix.cmake_arch }}" -DCMAKE_OSX_DEPLOYMENT_TARGET="${{ matrix.deployment_target }}")
          fi
          cmake "${CMAKE_OPTS[@]}"

      - name: Build
        shell: bash
        run: cmake --build build --parallel

      - name: Build Windows Targets
        if: matrix.platform == 'windows'
        run: cmake --build build --target package zip installer --parallel

      - name: Build MacOS Targets
        if: matrix.platform == 'mac'
        shell: bash
        run: cmake --build build --target dmg --parallel

      - name: Build Linux Targets
        if: matrix.platform == 'linux'
        run: cmake --build build --target appimage --parallel

      - name: Upload Windows zip Package
        uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows'
        with:
          name: NotepadNext-Windows-Qt${{ matrix.qt_version }}-Zip
          path: ${{ github.workspace }}/build/package/

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows'
        with:
          name: NotepadNext-Windows-Qt${{ matrix.qt_version }}-Installer
          path: ${{ github.workspace }}/installer/NotepadNext*.exe

      - name: Upload MacOS dmg
        uses: actions/upload-artifact@v4
        if: matrix.platform == 'mac'
        with:
          name: NotepadNext-macOS-${{ matrix.arch }}-Qt${{ matrix.qt_version }}
          path: ${{ github.workspace }}/build/NotepadNext*.dmg

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux'
        with:
          name: NotepadNext-Linux-Qt${{ matrix.qt_version }}-AppImage
          path: ${{ github.workspace }}/build/NotepadNext*.AppImage

  github:
    name: Draft GitHub Release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.repository == 'dail8859/NotepadNext' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Create Draft Release
        run: |
          gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} --generate-notes --draft
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Upload Windows Installer
        run: |
          gh release upload ${{ github.ref_name }} NotepadNext-Windows-Qt$QT_RELEASE_VER-Installer/NotepadNext-${{ github.ref_name }}-Installer.exe
      - name: Upload Windows Zip
        run: |
          cd NotepadNext-Windows-Qt$QT_RELEASE_VER-Zip/
          zip -r ../NotepadNext-${{ github.ref_name }}-win64.zip .
          cd ..
          gh release upload ${{ github.ref_name }} NotepadNext-${{ github.ref_name }}-win64.zip
      - name: Upload Linux AppImage
        run: |
          gh release upload ${{ github.ref_name }} NotepadNext-Linux-Qt$QT_RELEASE_VER-AppImage/NotepadNext-${{ github.ref_name }}-x86_64.AppImage
      - name: Upload macOS App
        run: |
          gh release upload ${{ github.ref_name }} NotepadNext-macOS-arm64-Qt${QT_RELEASE_VER}/NotepadNext-${{ github.ref_name }}.dmg
